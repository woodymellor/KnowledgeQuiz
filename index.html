<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knowledge Quiz</title>
<style>body{font-family:system-ui;background:#111;color:white;margin:0}main{max-width:700px;margin:auto;padding:22px}.card{background:#222;padding:22px;border-radius:18px;margin:18px 0}button{padding:16px;border:0;border-radius:13px;font:inherit;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.full{width:100%}.active{outline:3px solid white}#prompt{font-size:1.7rem;font-weight:700;min-height:80px;display:flex;align-items:center}.muted{opacity:.7}.hidden{display:none}#answer{background:#333;padding:14px;border-radius:12px;margin-top:12px}</style></head>
<body><main><h1>London Knowledge Quiz</h1><div class="muted">Questions come only from the loaded dataset.</div>
<details class="card" style="padding:14px 18px">
<summary style="font-weight:700;cursor:pointer">⚙ Settings</summary>
<div style="margin-top:14px">
<label for="voiceSelect">Voice</label>
<select id="voiceSelect" class="full" style="margin-top:6px"></select>
<label for="rate" style="display:block;margin-top:14px">Speech speed: <span id="rateValue">0.96×</span></label>
<input id="rate" type="range" min="0.70" max="1.30" step="0.05" value="0.96" style="width:100%;margin-top:8px">
<label for="volume" style="display:block;margin-top:14px">Voice volume: <span id="volumeValue">100%</span></label>
<input id="volume" type="range" min="0" max="1" step="0.05" value="1" style="width:100%;margin-top:8px">
<button id="testVoice" class="full" style="margin-top:12px">Test voice</button>
</div></details>
<div class="card">
<input id="jsonFile" type="file" accept=".json,application/json" style="display:none">
<div class="card" style="padding:14px 18px">
<label for="driveSheet"><strong>Daily Sheet Library</strong></label>
<select id="driveSheet" class="full" style="margin-top:8px"><option>Loading Drive library…</option></select>
<button id="loadDrive" class="full" style="margin-top:10px">LOAD SELECTED DAILY SHEET</button>
<div id="driveStatus" class="muted" style="margin-top:8px"></div>
</div>
<button id="loadJson" class="full">LOAD DAILY SHEET JSON MANUALLY</button>
<div id="sheetInfo" class="muted" style="margin-top:10px">Built-in test sheet loaded.</div>
<select id="appearanceSelect" class="full" style="margin-top:10px"></select>
</div>
<div class="grid"><button id="home">🎓 Appearance Mode</button><button id="ware">🎧 Revise Mode</button></div>
<div class="card"><div id="meta" class="muted"></div><div id="prompt">Choose a mode, then press Start.</div><div id="answer" class="hidden"></div><div id="status" class="muted"></div></div>
<div class="grid"><button id="prev">◀ Previous</button><button id="repeat">↻ Repeat</button></div><div class="grid"><button id="reveal" class="hidden">Reveal answer</button><button id="next" style="grid-column:1 / -1">Next ▶</button></div><button id="restart" class="full">Restart appearance</button>
<script>
const QUIZ_API='https://script.google.com/macros/s/AKfycbz9r5Rf6tyWjvtZ4D-EGnr5H8buga_5ET2x0mkmhL8gJ-pNEQt7jIRWi2MIdaeQiljq/exec';
let DATA={"date":"2026-09-15","appearances":[{"examiner":"Hall","level":"56s D","questions":[
{"start":"Rookery Hotel","startAnswer":"Peters Lane","destination":"Wandsworth Town Station","destinationAnswer":"Old York Road"},
{"start":"Keats House Museum","startAnswer":"Keats Grove","destination":"Sydenham Hill Station","destinationAnswer":"College Road"},
{"start":"Ladywell Railway Station","startAnswer":"Railway Terrace","destination":"Streatham Cemetery","destinationAnswer":"Garratt Lane"},
{"start":"Odeon Luxe Putney","startAnswer":"Putney High Street","destination":"King Edward VII Hospital for Officers","destinationAnswer":"Beaumont Street"}]}]};
let A=null;
function normalizeAppearance(raw){
 return {
   examiner:String(raw.examiner||"Unknown examiner"),
   level:String(raw.level||""),
   questions:(raw.questions||[]).map(x=>({
     start:String(x.start||""),
     sa:String(x.startAnswer??x.sa??""),
     dest:String(x.destination??x.dest??""),
     da:String(x.destinationAnswer??x.da??"")
   }))
 };
}
function loadAppearance(i){
 A=normalizeAppearance(DATA.appearances[i]);
 q=0;stage=0;started=false;appearanceComplete=false;
 render(false);
}
function populateAppearances(){
 const sel=$("appearanceSelect"); sel.innerHTML="";
 DATA.appearances.forEach((a,i)=>{
   const o=document.createElement("option");
   o.value=i; o.textContent=`${a.examiner||"Unknown"} · ${a.level||""} · ${(a.questions||[]).length} questions`;
   sel.appendChild(o);
 });
 $("sheetInfo").textContent=`${DATA.date||"Daily Sheet"} · ${DATA.appearances.length} appearance${DATA.appearances.length===1?"":"s"}`;
 loadAppearance(0);
}
let mode="home",q=0,stage=0,started=false,appearanceComplete=false,voice=null,timer=null,speechRate=parseFloat(localStorage.getItem("kqRate")||"0.96"),speechVolume=parseFloat(localStorage.getItem("kqVolume")||"1");const $=x=>document.getElementById(x);
function voices(){
 let v=speechSynthesis.getVoices();
 let sel=$("voiceSelect"); if(!sel)return;
 let saved=localStorage.getItem("kqVoice")||"";
 sel.innerHTML="";
 v.filter(x=>x.lang&&x.lang.toLowerCase().startsWith("en")).forEach((x,i)=>{
   let o=document.createElement("option");o.value=x.name;o.textContent=`${x.name} (${x.lang})`;sel.appendChild(o);
 });
 voice=v.find(x=>x.name===saved)||v.find(x=>x.lang==="en-GB"&&x.localService)||v.find(x=>x.lang==="en-GB")||v.find(x=>x.lang.startsWith("en"))||null;
 if(voice)sel.value=voice.name;
}
voices();speechSynthesis.onvoiceschanged=voices;
function phrase(){
 if(appearanceComplete) return "Appearance complete";
 let x=A.questions[q];
 return mode==="warehouse"?x.start+" to "+x.dest:stage===0?x.start:stage===1?x.dest:`Let's go from ${x.start} to ${x.dest}`;
}
function speak(){clearTimeout(timer);speechSynthesis.cancel();$("status").textContent="Speaking…";timer=setTimeout(()=>{let u=new SpeechSynthesisUtterance(phrase());u.lang="en-GB";u.rate=speechRate;u.volume=speechVolume;if(voice)u.voice=voice;u.onend=()=>$("status").textContent="Ready.";speechSynthesis.speak(u)},60)}
function render(talk=false){let x=A.questions[q];$("meta").textContent=`${A.examiner} · ${A.level} · Question ${q+1}/${A.questions.length}`;$("home").classList.toggle("active",mode==="home");$("ware").classList.toggle("active",mode==="warehouse");$("answer").classList.add("hidden");$("reveal").classList.add("hidden");$("prompt").textContent=!started?"Press Start Appearance.":appearanceComplete?"Appearance complete":mode==="warehouse"?x.start+" → "+x.dest:stage===0?x.start:stage===1?x.dest:x.start+" → "+x.dest;$("next").textContent=!started?"START APPEARANCE ▶":appearanceComplete?"NEXT APPEARANCE ▶":mode==="home"&&stage===2?"SET DOWN / NEXT QUESTION":mode==="home"?"CONFIRM & NEXT ▶":"Next ▶";if("mediaSession"in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:started?phrase():"Knowledge Quiz",artist:A.examiner+" · "+A.level,album:`Question ${q+1}/${A.questions.length}`});if(talk)requestAnimationFrame(()=>requestAnimationFrame(speak))}
function start(){started=true;appearanceComplete=false;q=0;stage=0;render(true)}
function next(){
 if(!started)return start();

 if(appearanceComplete){
   let sel=$("appearanceSelect");
   let i=Number(sel.value);
   if(i < DATA.appearances.length-1){
     sel.value=String(i+1);
     loadAppearance(i+1);
     start();
   } else {
     $("status").textContent="End of Daily Sheet.";
     speechSynthesis.cancel();
     let u=new SpeechSynthesisUtterance("Daily sheet complete");
     u.lang="en-GB";u.rate=speechRate;u.volume=speechVolume;if(voice)u.voice=voice;
     speechSynthesis.speak(u);
   }
   return;
 }

 if(mode==="warehouse"){
   if(q===A.questions.length-1){
     appearanceComplete=true; render(false); speak(); return;
   }
   q++;stage=0;render(true);return;
 }

 if(stage===0 || stage===1){
   let x=A.questions[q];
   let ans=stage===0?x.sa:x.da;
   speechSynthesis.cancel();
   $("answer").textContent=ans;
   $("answer").classList.remove("hidden");
   $("status").textContent="Confirming answer…";
   let u=new SpeechSynthesisUtterance(ans);
   u.lang="en-GB";u.rate=speechRate;u.volume=speechVolume;if(voice)u.voice=voice;
   u.onend=()=>{
     stage++;
     $("answer").classList.add("hidden");
     render(true);
   };
   speechSynthesis.speak(u);
   return;
 }

 // Set down after calling the route.
 if(q===A.questions.length-1){
   appearanceComplete=true;
   render(false);
   speak();
 } else {
   q++;stage=0;render(true);
 }
}
function prev(){if(!started)return;if(mode==="warehouse"){q=(q-1+A.questions.length)%A.questions.length;stage=0}else if(stage>0)stage--;else{q=(q-1+A.questions.length)%A.questions.length;stage=0}render(true)}
function reveal(){
 if(!started||stage===2)return;
 let x=A.questions[q];
 let ans=stage===0?x.sa:x.da;
 $("answer").textContent=ans;
 $("answer").classList.remove("hidden");
 clearTimeout(timer);
 speechSynthesis.cancel();
 timer=setTimeout(()=>{
   let u=new SpeechSynthesisUtterance(ans);
   u.lang="en-GB"; u.rate=speechRate; u.volume=speechVolume; if(voice)u.voice=voice;
   speechSynthesis.speak(u);
 },60);
}
$("home").onclick=()=>{mode="home";stage=0;render(started)};$("ware").onclick=()=>{mode="warehouse";stage=0;render(started)};$("next").onclick=next;$("prev").onclick=prev;$("repeat").onclick=()=>started&&speak();$("reveal").onclick=reveal;$("restart").onclick=start;

$("rate").value=speechRate;$("rateValue").textContent=speechRate.toFixed(2)+"×";
$("rate").oninput=e=>{speechRate=parseFloat(e.target.value);$("rateValue").textContent=speechRate.toFixed(2)+"×";localStorage.setItem("kqRate",speechRate)};
$("volume").value=speechVolume;$("volumeValue").textContent=Math.round(speechVolume*100)+"%";
$("volume").oninput=e=>{speechVolume=parseFloat(e.target.value);$("volumeValue").textContent=Math.round(speechVolume*100)+"%";localStorage.setItem("kqVolume",speechVolume)};
$("voiceSelect").onchange=e=>{let v=speechSynthesis.getVoices();voice=v.find(x=>x.name===e.target.value)||voice;localStorage.setItem("kqVoice",e.target.value)};
$("testVoice").onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance("Rookery Hotel to Wandsworth Town Station.");u.lang="en-GB";u.rate=speechRate;u.volume=speechVolume;if(voice)u.voice=voice;speechSynthesis.speak(u)};

async function loadDriveLibrary(){
 const st=$("driveStatus"),sel=$("driveSheet");
 try{
  st.textContent="Loading library…";
  const r=await fetch(QUIZ_API+"?action=list");
  const d=await r.json();
  if(!d.ok)throw new Error(d.error||"Library request failed");
  sel.innerHTML="";
  d.sheets.forEach(x=>{let o=document.createElement("option");o.value=x.date;
   let dt=new Date(x.date+"T12:00:00");
   o.textContent=dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
   sel.appendChild(o);});
  st.textContent=d.count+" Daily Sheets available.";
 }catch(e){sel.innerHTML="<option>Drive library unavailable</option>";st.textContent="Could not load Drive library: "+e.message;}
}
$("loadDrive").onclick=async()=>{
 const date=$("driveSheet").value,st=$("driveStatus");
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
 try{
  st.textContent="Loading "+date+"…";
  const r=await fetch(QUIZ_API+"?action=get&date="+encodeURIComponent(date));
  const d=await r.json();
  if(!d.ok)throw new Error(d.error||"Sheet request failed");
  DATA=d.sheet;populateAppearances();st.textContent="Loaded "+date+" from Drive.";
 }catch(e){st.textContent="Could not load sheet: "+e.message;}
};
loadDriveLibrary();
$("loadJson").onclick=()=>$("jsonFile").click();
$("jsonFile").onchange=async e=>{
 const f=e.target.files[0]; if(!f)return;
 try{
   const parsed=JSON.parse(await f.text());
   if(!parsed || !Array.isArray(parsed.appearances) || !parsed.appearances.length) throw new Error("No appearances");
   for(const a of parsed.appearances){
     if(!Array.isArray(a.questions) || !a.questions.length) throw new Error("Appearance has no questions");
     for(const x of a.questions){
       if(!x.start || !(x.destination||x.dest)) throw new Error("Question missing start/destination");
     }
   }
   DATA=parsed; populateAppearances();
   $("status").textContent="Daily Sheet loaded.";
 }catch(err){
   alert("That JSON is not a valid Knowledge Quiz Daily Sheet.");
 }
};
$("appearanceSelect").onchange=e=>loadAppearance(Number(e.target.value));
if("mediaSession"in navigator){try{navigator.mediaSession.setActionHandler("nexttrack",next);navigator.mediaSession.setActionHandler("previoustrack",prev);navigator.mediaSession.setActionHandler("play",()=>started?speak():start())}catch(e){}}
populateAppearances();
</script></main></body></html>
