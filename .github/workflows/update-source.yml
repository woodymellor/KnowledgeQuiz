name: Update Knowledge Source

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check source
        run: python updater/update_source.py --root knowledge-source

      - name: Rebuild Knowledge data when source changed
        run: |
          if [ -n "$(git status --porcelain -- knowledge-source)" ]; then
            python updater/build_knowledge_data.py --input knowledge-source/current/data --output knowledge-data.json
          fi

      - name: Remove legacy names
        run: |
          rm -rf wizann-data
          rm -f updater/update_wizann.py
          rm -f .github/workflows/update-wizann.yml

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Knowledge Source"
          git push
