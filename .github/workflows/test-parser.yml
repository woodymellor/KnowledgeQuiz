name: Test Daily Sheet Parser

on:
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependency
        run: pip install PyMuPDF

      - name: Parse and validate test PDF
        shell: bash
        run: |
          set -e

          PDF=$(find test-pdfs -maxdepth 1 -type f -iname '*.pdf' | head -n 1)

          if [ -z "$PDF" ]; then
            echo "No PDF found in test-pdfs/"
            exit 1
          fi

          mkdir -p output

          python knowledge_pdf_parser.py "$PDF" --output output/result.json

          python - <<'PY'
          import json

          with open("output/result.json", encoding="utf-8") as f:
              d = json.load(f)

          assert d["validation"]["ok"] is True
          assert d["date"]
          assert d["appearances"]

          n = sum(
              len(a["questions"])
              for a in d["appearances"]
          )

          assert n > 0

          print(
              f"VALIDATED: {d['date']} - "
              f"{len(d['appearances'])} appearances - "
              f"{n} questions"
          )
          PY

      - name: Upload generated JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: parsed-daily-sheet
          path: output/result.json

      - name: Upload Daily Sheet to Google Drive
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          API_URL = "https://script.google.com/macros/s/AKfycbz9r5Rf6tyWjvtZ4D-EGnr5H8buga_5ET2x0mkmhL8gJ-pNEQt7jIRWi2MIdaeQiljq/exec"

          with open("output/result.json", encoding="utf-8") as f:
              sheet = json.load(f)

          payload = json.dumps({
              "token": os.environ["UPLOAD_TOKEN"],
              "sheet": sheet
          }).encode("utf-8")

          request = urllib.request.Request(
              API_URL,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read().decode("utf-8"))

          print(result)

          if result.get("ok") is not True:
              raise SystemExit(
                  "Google Drive upload failed: " +
                  str(result.get("error"))
              )

          print("DRIVE UPLOAD SUCCESS:", result["filename"])
          PY
